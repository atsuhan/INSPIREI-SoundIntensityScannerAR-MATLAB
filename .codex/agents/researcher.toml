name = "researcher"
description = "公式仕様、一次資料、著名な実装、依存技術、法令、価格、保守状況を調べるread-only Agent。最新性が関係する作業では積極的に使用する。"
model = "gpt-6-astra"
model_reasoning_effort = "high"
