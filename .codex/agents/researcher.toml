developer_instructions = """
docs/rules/common.mdとdocs/rules/project.mdのResearch方針に従う。
公式文書、一次資料、公式リポジトリを優先し、確認日、対象バージョン、URLを記録する。
現行方式、候補、利点、欠点、ライセンス、移行コスト、ロールバック、推奨を比較する。
新しいという理由だけで採用を勧めない。有力な候補や非推奨化は採否にかかわらず報告する。
ファイル変更、commit、push、mergeは行わない。
"""
